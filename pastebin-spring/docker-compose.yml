services:
  pastebin:
    build: .
    image: ssiposs/kubernetes-lab-01:lab1
    container_name: pastebin-spring-lab1
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 5
